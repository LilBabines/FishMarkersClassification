hydra:
  run:
    dir: outputs/fine_tune_taxa/teleo_from_pt_dnabert2

data:
  dataset_path: "data"

trainer:
  kwargs :

    learning_rate: 2e-5
    per_device_train_batch_size : 32
    per_device_eval_batch_size : 16
    weight_decay: 0.001
    warmup_ratio: 0.1
    num_train_epochs : 15
    eval_strategy : "steps"
    eval_steps : 1200
    logging_steps : 1200
    save_steps : 1200
    logging_first_step : True
    save_strategy : "steps"
    lr_scheduler_type : "cosine_with_restarts"
    metric_for_best_model: "macro_f1_family"
    greater_is_better: True
    push_to_hub : False
    # save best and last checkpoint only
    save_total_limit : 2
    load_best_model_at_end : True
    report_to : "tensorboard"

  early_stopping_patience : 30
  
loss :
  loss : "cross_entropy"


metrics:

  macro_f1:
    callable: 'MulticlassF1Score'
    kwargs: 
      average: 'macro'
  macro_accuracy:
    callable: 'MulticlassAccuracy'
    kwargs:
      average: 'macro'
  micro_f1:
    callable: 'MulticlassF1Score'
    kwargs: 
      average: 'micro'
  micro_accuracy:
    callable: 'MulticlassAccuracy'
    kwargs:
      average: 'micro'



  
