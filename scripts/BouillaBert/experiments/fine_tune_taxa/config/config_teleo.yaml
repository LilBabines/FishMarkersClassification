hydra:
  run:
    dir: experiments/fine_tune_taxa/outputs/teleo_from_random_weights

data:
  dataset_path: "experiments/fine_tune_taxa/data/teleo/folds"

task:
  train : True  # False if just want to load model and evaluate, true to train before it
  checkpoint_path : experiments/masking_training/outputs/masking_teleo/checkpoints
  save_preds : True
  task: "multiTaxa" # multiTaxa or singleTaxa
  
  # taxa_classes : ["order", "family"]

trainer:
  kwargs :

    learning_rate: 2e-5
    per_device_train_batch_size : 16
    per_device_eval_batch_size : 16
    weight_decay: 0.001
    warmup_ratio: 0.1
    num_train_epochs : 15
    eval_strategy : "steps"
    eval_steps : 1200
    logging_steps : 1200
    save_steps : 1200
    logging_first_step : True
    save_strategy : "steps"
    lr_scheduler_type : "cosine_with_restarts"
    metric_for_best_model: "macro_f1_family"
    greater_is_better: True
    push_to_hub : False
    # save best and last checkpoint only
    save_total_limit : 2
    load_best_model_at_end : True
    report_to : "tensorboard"

  early_stopping_patience : 30
  

model:
  model_name: "zhihan1996/DNABERT-2-117M"
  tokenizer_name: "zhihan1996/DNABERT-2-117M"  # can train "bpe" or an int for k-mer
  local : False  # set to True to load the model with model_name from local path
  local_path :  experiments/masking_training/outputs/masking_teleo/checkpoints
  use_pretrained : False
  bert_kwargs :
    hidden_size: 768
    max_position_embeddings: 512


loss :
  loss : "cross_entropy"


metrics:

  macro_f1:
    callable: 'MulticlassF1Score'
    kwargs: 
      average: 'macro'
  macro_accuracy:
    callable: 'MulticlassAccuracy'
    kwargs:
      average: 'macro'
  micro_f1:
    callable: 'MulticlassF1Score'
    kwargs: 
      average: 'micro'
  micro_accuracy:
    callable: 'MulticlassAccuracy'
    kwargs:
      average: 'micro'



  
